[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charter-clause-extractor"
version = "0.1.0"
description = "Extract Part II legal clauses from voyage charter PDFs via LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24.0",
  "openai>=1.40.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.7.0",
]

[project.scripts]
extract-charter-clauses = "charter_clauses.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["charter_clauses*"]
